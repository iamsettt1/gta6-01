  <style>
    html, body {
      margin: 0;

      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #wrap {
      display: flex;
      align-items: center;

      width: min(100vw, calc(100vh * 16 / 9));

      background: #0b0e14;
      cursor: crosshair;
      image-rendering: auto;
    }
  </style>
</head>
